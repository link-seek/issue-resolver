name: Deploy Smoke Test

# Reusable workflow: 部署后现网验证
#   uses: link-seek/issue-resolver/.github/workflows/deploy-smoke.yml@main
#   with:
#     frontend-url: https://www.xieyucheng.top
#     api-url: https://api.xieyucheng.top
#   secrets: inherit

on:
  workflow_call:
    inputs:
      frontend-url:
        description: 'Frontend public URL'
        required: true
        type: string
      api-url:
        description: 'API public URL (backend)'
        required: true
        type: string
      create-issue-on-fail:
        description: 'Create issue in app repo on smoke failure'
        required: false
        default: false
        type: boolean
      app-repo:
        description: 'Repo to create issue in (owner/repo)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test — Backend API
        id: backend
        run: |
          FAIL_REASON=""
          API_URL="${{ inputs.api-url }}"

          echo "=== Test 1: Backend health ==="
          HEALTH=$(curl -sf -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
          echo "Backend health: $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            FAIL_REASON="Backend health returned $HEALTH"
            echo "fail_reason=$FAIL_REASON" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "=== Test 2: GraphQL endpoint ==="
          GRAPHQL=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST "$API_URL/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}' 2>/dev/null || echo "000")
          echo "GraphQL endpoint: $GRAPHQL"
          if [ "$GRAPHQL" != "200" ]; then
            FAIL_REASON="GraphQL endpoint returned $GRAPHQL"
            echo "fail_reason=$FAIL_REASON" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "=== Test 3: Login API alive ==="
          LOGIN=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST "$API_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"__smoke__","password":"__invalid__"}' 2>/dev/null || echo "000")
          echo "Login API (expect 4xx): $LOGIN"
          if echo "$LOGIN" | grep -qE "50[02345]|000"; then
            FAIL_REASON="Login API returned $LOGIN (server error)"
            echo "fail_reason=$FAIL_REASON" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "All backend smoke tests passed"

      - name: Smoke test — Frontend
        id: frontend
        run: |
          FAIL_REASON=""
          FE_URL="${{ inputs.frontend-url }}"

          echo "=== Test 4: Frontend serves HTML ==="
          FRONTEND=$(curl -sf -o /dev/null -w "%{http_code}" "$FE_URL/" 2>/dev/null || echo "000")
          echo "Frontend: $FRONTEND"
          if [ "$FRONTEND" != "200" ]; then
            FAIL_REASON="Frontend returned $FRONTEND"
            echo "fail_reason=$FAIL_REASON" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "=== Test 5: Frontend has JS bundle ==="
          curl -sf "$FE_URL/" | grep -qo 'script' || {
            FAIL_REASON="No script tag in frontend HTML"
            echo "fail_reason=$FAIL_REASON" >> $GITHUB_OUTPUT
            exit 1
          }

          echo "All frontend smoke tests passed"

      - name: Classify failure and create issue
        if: failure() && inputs.create-issue-on-fail && inputs.app-repo != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const api = github.rest;
            const [owner, repo] = '${{ inputs.app-repo }}'.split('/');

            // Classify the failure
            const apiFail = '${{ steps.backend.outcome }}' === 'failure';
            const feFail = '${{ steps.frontend.outcome }}' === 'failure';
            const apiReason = '${{ steps.backend.outputs.fail_reason }}';
            const feReason = '${{ steps.frontend.outputs.fail_reason }}';

            let category, labels, body;

            if (apiFail && apiReason.includes('502')) {
              category = 'infrastructure';
              labels = ['deploy-broken', 'infrastructure'];
              body = `## Deploy Smoke Test Failed — Infrastructure

              **Category**: Infrastructure bug (502 error)
              **API URL**: ${{ inputs.api-url }}
              **Reason**: ${apiReason}

              ### Action
              This looks like an infrastructure issue (backend not running or CDN misconfigured).
              @mention operations team.
              `;
            } else if (apiFail && apiReason.includes('405')) {
              category = 'code';
              labels = ['deploy-broken', 'bug'];
              body = `## Deploy Smoke Test Failed — Code Bug

              **Category**: Code bug (405 error)
              **API URL**: ${{ inputs.api-url }}
              **Reason**: ${apiReason}

              ### Action
              This looks like a code bug (wrong route or method). Auto-fix should handle this.
              `;
            } else {
              category = 'unknown';
              labels = ['deploy-broken'];
              body = `## Deploy Smoke Test Failed

              **API**: ${{ apiFail ? apiReason : 'passed' }}
              **Frontend**: ${{ feFail ? feReason : 'passed' }}

              ### Action
              Needs investigation.
              `;
            }

            await api.issues.create({
              owner,
              repo,
              title: `deploy-broken: smoke test failed (${category})`,
              body,
              labels
            });

            core.info(`Created issue in ${owner}/${repo} with category: ${category}`);
