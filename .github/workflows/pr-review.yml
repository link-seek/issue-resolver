name: PR Review

on:
  workflow_call:
    inputs:
      enable-e2e-coverage-check:
        description: 'Run E2E test coverage check'
        required: false
        default: false
        type: boolean
      coverage-mappings:
        description: 'JSON array of {src_pattern, test_dir, label} for coverage check'
        required: false
        default: '[]'
        type: string
      enable-ai-review:
        description: 'Run AI review'
        required: false
        default: true
        type: boolean
      human-review-paths:
        description: 'JSON array of path patterns requiring human review'
        required: false
        default: '[]'
        type: string
      blocking-severities:
        description: 'Comma-separated severity emojis that block merge'
        required: false
        default: '🔴,🟠'
        type: string
      llm-model:
        description: 'LLM model for review'
        required: false
        default: 'openai/glm-5.2'
        type: string
      max-auto-fix-iterations:
        description: 'Max auto-fix iterations'
        required: false
        default: '10'
        type: string
      review-timeout-minutes:
        description: 'Review timeout in minutes'
        required: false
        default: '360'
        type: string
      auto-fix-workflow:
        description: 'Workflow to dispatch for auto-fix'
        required: false
        default: 'on-comment-fix.yml'
        type: string

    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      LLM_API_KEY_1:
        required: true
      LLM_API_KEY_2:
        required: true
      LLM_API_KEY_3:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  continue-fix:
    if: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'continue-fix' && github.event.issue.pull_request != null && contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Log continue-fix trigger
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ASSOC: ${{ github.event.comment.author_association }}
        run: |
          echo "continue-fix on PR #$PR_NUMBER by $COMMENTER ($ASSOC)"

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get PR info and dispatch auto-fix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          AUTO_FIX_WORKFLOW: ${{ inputs.auto-fix-workflow }}
        run: |
          PR_INFO=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER \
            --jq '{head_branch: .head.ref, head_sha: .head.sha}')
          HEAD_BRANCH=$(echo "$PR_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_branch'])")
          HEAD_SHA=$(echo "$PR_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['head_sha'])")

          echo "Dispatching auto-fix for PR #$PR_NUMBER (branch: $HEAD_BRANCH)"
          echo "max_iterations=20 (10 original + 10 continue)"

          gh workflow run "$AUTO_FIX_WORKFLOW" \
            -f pr_number="$PR_NUMBER" \
            -f head_branch="$HEAD_BRANCH" \
            -f head_sha="$HEAD_SHA" \
            -f max_iterations="20" || echo "Failed to dispatch auto-fix"

      - name: React to comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content="rocket" 2>/dev/null || true

  e2e-coverage-check:
    if: ${{ github.event_name == 'pull_request' && inputs.enable-e2e-coverage-check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check E2E test coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_MAPPINGS: ${{ inputs.coverage-mappings }}
        run: |
          CHANGED_FILES=$(gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')

          FRONTEND_SRC_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^frontend/src/' \
            | grep -E '^frontend/src/(views/|api/|stores/|lib/apollo)' || true)

          if [ -z "$FRONTEND_SRC_CHANGES" ]; then
            echo "No testable frontend source changes — skipping E2E coverage check"
            exit 0
          fi

          echo "Frontend source changes:"
          echo "$FRONTEND_SRC_CHANGES"

          MISSING=()

          check_area() {
            local src_pattern="$1" test_dir="$2" label="$3"
            if echo "$FRONTEND_SRC_CHANGES" | grep -qE "$src_pattern"; then
              if ! echo "$CHANGED_FILES" | grep -qE "^frontend/tests/${test_dir}/.*\.spec\.ts$"; then
                MISSING+=("$label: $src_pattern changed but no tests/${test_dir}/*.spec.ts in PR")
              fi
            fi
          }

          echo "$COVERAGE_MAPPINGS" | python3 -c "
          import sys, json
          for m in json.load(sys.stdin):
              print(f\"{m['src_pattern']}\t{m['test_dir']}\t{m['label']}\")
          " | while IFS=$'\t' read -r src test_dir label; do
            check_area "$src" "$test_dir" "$label"
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::E2E test coverage missing:"
            for msg in "${MISSING[@]}"; do
              echo "  - $msg"
            done
            exit 1
          fi

          echo "E2E test coverage OK — PR includes corresponding test changes"

  review-ai:
    if: ${{ github.event_name == 'pull_request' && inputs.enable-ai-review }}
    needs: [e2e-coverage-check]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: review-ai-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permissions: >-
            contents: write,
            pull-requests: write,
            issues: write,
            actions: write,
            checks: read

      - name: Resolve LLM config
        id: llm
        env:
          RAW_MODEL: ${{ inputs.llm-model }}
        run: |
          MODEL="${RAW_MODEL#openai/}"
          MODEL="${MODEL#anthropic/}"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Resolved model: $MODEL"

      - name: Setup LiteLLM proxy
        shell: bash
        run: |
          cat > /tmp/litellm_config.yaml << 'EOF'
          model_list:
            - model_name: glm-5.2
              litellm_params:
                model: openai/glm-5.2
                api_key: ${{ secrets.LLM_API_KEY_1 }}
                api_base: https://api.modelarts-maas.com/v2
            - model_name: glm-5.2
              litellm_params:
                model: openai/glm-5.2
                api_key: ${{ secrets.LLM_API_KEY_2 }}
                api_base: https://api.modelarts-maas.com/v2
            - model_name: glm-5.2
              litellm_params:
                model: openai/glm-5.2
                api_key: ${{ secrets.LLM_API_KEY_3 }}
                api_base: https://api.modelarts-maas.com/v2
          router_settings:
            routing_strategy: simple-shuffle
            num_retries: 3
            allowed_fails: 3
            request_timeout: 120
          general_settings:
            master_key: sk-litellm-proxy
            drop_params: true
          EOF

          docker run -d --name litellm \
            -p 4000:4000 \
            -v /tmp/litellm_config.yaml:/app/config.yaml \
            ghcr.io/berriai/litellm:main-latest \
            --config /app/config.yaml --port 4000 --host 0.0.0.0

          echo "Waiting for LiteLLM proxy to be ready..."
          for i in $(seq 1 60); do
            if curl -sf -H "Authorization: Bearer sk-litellm-proxy" http://localhost:4000/health > /dev/null 2>&1; then
              echo "LiteLLM proxy ready (attempt $i)"
              curl -s -H "Authorization: Bearer sk-litellm-proxy" http://localhost:4000/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::LiteLLM proxy failed to start"
          docker logs litellm 2>&1 | tail -50
          exit 1

      - name: Run Open Code Review
        id: ocr
        uses: alibaba/open-code-review@v1.8.0
        with:
          llm_url: http://localhost:4000/v1
          llm_auth_token: sk-litellm-proxy
          llm_model: ${{ steps.llm.outputs.model }}
          llm_use_anthropic: 'false'
          language: '中文'
          incremental: 'true'
          sticky_summary: 'true'
          github_token: ${{ steps.app-token.outputs.token }}
          ocr_version: '1.8.0'

      - name: Wait for all gates and dispatch auto-fix if needed
        id: verdict
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTO_FIX_WORKFLOW: ${{ inputs.auto-fix-workflow }}
        run: |
          if [ ! -f /tmp/ocr-result.json ]; then
            echo "::error::OCR result file not found"
            exit 1
          fi

          # --- 1. Parse OCR verdict ---
          VERDICT=$(python3 -c "
          import json
          with open('/tmp/ocr-result.json') as f:
              data = json.load(f)
          comments = data.get('comments', [])
          blocking = [c for c in comments if c.get('severity') in ('critical', 'high')]
          medium = [c for c in comments if c.get('severity') == 'medium']
          total = len(comments)
          print(f'Total findings: {total}')
          print(f'Blocking (critical/high): {len(blocking)}')
          print(f'Medium: {len(medium)}')
          if blocking:
              print()
              print('Blocking issues:')
              for c in blocking:
                  sev = c.get('severity', '?')
                  path = c.get('path', '?')
                  line = c.get('start_line', '?')
                  cat = c.get('category', '?')
                  content = c.get('content', '')[:150]
                  print(f'  [{sev}] {path}:{line} ({cat}) — {content}')
          if medium and not blocking:
              print()
              print('Medium issues (not blocking, not auto-fixing):')
              for c in medium:
                  path = c.get('path', '?')
                  line = c.get('start_line', '?')
                  content = c.get('content', '')[:100]
                  print(f'  [medium] {path}:{line} — {content}')
          print(f'BLOCKING={len(blocking)}')
          print(f'MEDIUM={len(medium)}')
          " 2>&1)

          echo "$VERDICT"

          OCR_BLOCKING=$(echo "$VERDICT" | grep '^BLOCKING=' | cut -d= -f2)
          OCR_MEDIUM=$(echo "$VERDICT" | grep '^MEDIUM=' | cut -d= -f2)

          # --- 2. Get current workflow run's check-run IDs (to exclude self) ---
          MY_CHECK_IDS=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs \
            --jq '[.jobs[].id] | map(tostring) | join(",")' 2>/dev/null || echo "")
          echo "Excluding job IDs from current workflow run: $MY_CHECK_IDS"

          # --- 3. Wait for all other check-runs to complete ---
          echo "Waiting for all other gates to complete..."
          for i in $(seq 1 60); do
            PENDING=$(gh api repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs \
              --jq "[.check_runs[] | select(.name | startswith(\"pr-review\")) | not) and .status != \"completed\"] | length" 2>/dev/null || echo "0")
            if [ "$PENDING" -eq 0 ]; then
              echo "All gates completed (waited $((i*10))s)"
              break
            fi
            echo "  $PENDING gate(s) still running... (attempt $i/60)"
            sleep 10
          done

          # --- 4. Collect CI failures ---
          CI_FAILED=$(gh api repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs \
            --jq "[.check_runs[] | select(.name | startswith(\"pr-review\")) | not) and .conclusion == \"failure\"] | length" 2>/dev/null || echo "0")

          echo "OCR blocking: $OCR_BLOCKING"
          echo "OCR medium: $OCR_MEDIUM"
          echo "CI failures: $CI_FAILED"

          # --- 5. Unified dispatch decision ---
          if [ "$OCR_BLOCKING" -gt 0 ] || [ "$CI_FAILED" -gt 0 ]; then
            echo "::warning::Found $OCR_BLOCKING OCR blocking + $CI_FAILED CI failures"
            echo "Dispatching auto-fix with full context (review + CI)..."
            gh workflow run "$AUTO_FIX_WORKFLOW" \
              -f pr_number="$PR_NUMBER" \
              -f head_branch="$HEAD_BRANCH" \
              -f head_sha="$HEAD_SHA" || echo "Failed to dispatch auto-fix"
            # OCR blocking makes the job fail; CI-only failures don't block the job
            if [ "$OCR_BLOCKING" -gt 0 ]; then
              echo "::error::OCR review found $OCR_BLOCKING blocking issues"
              exit 1
            fi
            echo "Auto-fix dispatched for CI failures (OCR passed)"
            exit 0
          elif [ "$OCR_MEDIUM" -gt 0 ]; then
            echo "All gates passed with $OCR_MEDIUM medium issue(s) — not blocking. Comment 'continue-fix' to manually trigger."
            exit 0
          else
            echo "All gates passed — no issues found"
            exit 0
          fi
